<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notation Trainer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section id="welcome-screen" class="welcome-screen" aria-labelledby="welcome-title">
        <div class="welcome-content">
          <p class="eyebrow">Welcome</p>
          <h1 id="welcome-title">Notation Trainer</h1>
          <p id="welcome-copy">Choose what you want to practice.</p>
          <div id="practice-choice" class="practice-choice" aria-label="Choose practice type">
            <button id="practice-note-names" type="button" class="practice-choice-button">
              <span>Practice Note Names</span>
              <small>Use the full preset or manual range.</small>
            </button>
            <button id="practice-scales" type="button" class="practice-choice-button">
              <span>Practice Scales</span>
              <small>Choose an instrument scale path.</small>
            </button>
          </div>
          <div id="scale-presets" class="scale-launcher" aria-label="Choose an instrument scale" hidden></div>
          <div id="welcome-actions" class="welcome-actions" hidden>
            <button id="welcome-back" class="secondary" type="button">Back</button>
          </div>
        </div>
      </section>

      <section class="practice-pane" aria-label="Note practice">
        <header class="topbar">
          <div>
            <h1>Notation Trainer</h1>
            <p class="eyebrow">Music note review</p>
          </div>
          <div class="topbar-actions">
            <button id="home-button" class="secondary home-button" type="button">Home</button>
            <div class="score-strip" aria-label="Session stats">
              <div>
                <span id="score">0</span>
                <small>score</small>
              </div>
              <div>
                <span id="streak">0</span>
                <small>streak</small>
              </div>
              <div>
                <span id="accuracy">0%</span>
                <small>accuracy</small>
              </div>
            </div>
            <button id="settings-toggle" class="menu-button" type="button" aria-label="Open settings" aria-controls="settings-panel" aria-expanded="false">
              <span class="menu-lines" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
              </span>
              <span class="menu-label">Menu</span>
            </button>
          </div>
        </header>

        <div id="scale-toolbar" class="scale-toolbar" hidden>
          <div>
            <strong id="scale-toolbar-instrument">Instrument</strong>
            <span>Scale practice</span>
          </div>
          <label for="scale-instrument-select">Instrument</label>
          <select id="scale-instrument-select"></select>
          <label for="scale-select">Scale</label>
          <select id="scale-select"></select>
        </div>

        <div class="practice-grid">
          <div class="staff-wrap">
            <svg id="staff" viewBox="0 0 720 310" role="img" aria-labelledby="staff-title staff-desc">
              <title id="staff-title">Music staff</title>
              <desc id="staff-desc">A note appears on the selected clef staff. Choose its name.</desc>
            </svg>
          </div>

          <div class="answer-panel">
            <div class="prompt-row" aria-live="polite">
              <p id="prompt">Name this note.</p>
              <button id="note-helpers" class="helper-button" type="button" aria-pressed="false">Helpers</button>
            </div>

            <div id="answers" class="answer-grid" aria-label="Answer choices"></div>

            <div class="action-row">
              <button id="show-answer" type="button" class="secondary">Show answer</button>
              <button id="next-note" type="button">Next note</button>
            </div>
          </div>
        </div>
      </section>

      <div id="settings-backdrop" class="settings-backdrop" hidden></div>
      <aside id="settings-panel" class="review-pane" aria-label="Practice settings and review" aria-hidden="true">
        <div class="settings-header">
          <h2>Settings</h2>
          <button id="settings-close" class="icon-button close-button" type="button" aria-label="Close settings">×</button>
        </div>

        <section class="control-section">
          <h2>Clef</h2>
          <div class="segmented clef-segmented" role="group" aria-label="Clef">
            <button type="button" class="active" data-clef="treble">Treble</button>
            <button type="button" data-clef="alto">Alto</button>
            <button type="button" data-clef="tenor">Tenor</button>
            <button type="button" data-clef="bass">Bass</button>
          </div>
          <label class="toggle">
            <input id="bass-instruments-tenor-clef" type="checkbox">
            <span>Use tenor clef for bass-clef presets</span>
          </label>
        </section>

        <section class="control-section">
          <h2>Instrument Range</h2>
          <div id="instrument-presets" class="preset-grid" role="group" aria-label="Instrument range presets"></div>
        </section>

        <section class="control-section">
          <h2>Practice Range</h2>
          <label for="low-note">Lowest note</label>
          <select id="low-note"></select>
          <label for="high-note">Highest note</label>
          <select id="high-note"></select>
        </section>

        <section class="control-section">
          <h2>Mode</h2>
          <div class="segmented" role="group" aria-label="Practice mode">
            <button type="button" class="active" data-mode="all">All notes</button>
            <button type="button" data-mode="missed">Missed</button>
          </div>
        </section>

        <section class="control-section progress-section">
          <h2>Review</h2>
          <div id="review-list" class="review-list" aria-live="polite"></div>
          <button id="reset-session" type="button" class="secondary full">Reset session</button>
        </section>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
